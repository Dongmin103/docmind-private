# Recovery timing and workspace mount for the Windows cloud-source deployment.
# The image entrypoint starts only the API; admin is on demand.
# Discovery uses the host watcher.
services:
  ragflow-cpu:
    command:
      - --init-model-provider-tables
    environment:
      DOCMIND_EPHEMERAL_REAPER_INTERVAL_SECONDS: "60"
    # The existing local source overlay mounts the service modules. Include
    # the matching workspace-lock implementation in this development rollout.
    volumes:
      - ../rag/parser_platform/ephemeral_input.py:/ragflow/rag/parser_platform/ephemeral_input.py:ro
